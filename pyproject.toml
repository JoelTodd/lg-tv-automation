[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lg-tv-automation"
version = "0.1.0"
description = "Fedora KDE + NVIDIA + LG webOS playback automation for mpv."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "bscpylgtv>=0.5.1,<0.6",
  "Pillow>=12,<13",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lg-tv-play = "lg_tv_automation.cli.play:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
